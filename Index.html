<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D&D 5e (2024) Character Creator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>D&D 5e (2024) Creator</h1>
    </header>

    <main id="wizard-form">
      <!-- Step 1: Basics -->
      <section class="wizard-step active" id="step-1">
        <h2>Step 1: Basics</h2>
        <label>Character Name:</label>
        <input type="text" id="char-name" placeholder="e.g., Lucan" />

        <label>Class:</label>
        <select id="char-class">
          <option value="Fighter">Fighter</option>
          <option value="Rogue">Rogue</option>
          <option value="Wizard">Wizard</option>
          <option value="Cleric">Cleric</option>
        </select>

        <label>Species (2024 Rules):</label>
        <select id="char-species">
          <option value="Human">Human</option>
          <option value="Elf">Elf</option>
          <option value="Dwarf">Dwarf</option>
          <option value="Halfling">Halfling</option>
        </select>
      </section>

      <!-- Step 2: Background -->
      <section class="wizard-step" id="step-2">
        <h2>Step 2: Background & Origin</h2>
        <label>Background (2024 Rules):</label>
        <select id="char-bg">
          <option value="Acolyte">Acolyte (+1 WIS, +2 CHA / Insight, Religion)</option>
          <option value="Criminal">Criminal (+2 DEX, +1 CON / Sleight of Hand, Stealth)</option>
          <option value="Soldier">Soldier (+2 STR, +1 CON / Athletics, Intimidation)</option>
          <option value="Sage">Sage (+2 INT, +1 CON / Arcana, History)</option>
        </select>
      </section>

      <!-- Step 3: Ability Scores -->
      <section class="wizard-step" id="step-3">
        <h2>Step 3: Ability Scores</h2>
        <div class="score-grid">
          <div><label>STR</label><input type="number" id="score-str" value="10" min="3" max="20" /></div>
          <div><label>DEX</label><input type="number" id="score-dex" value="10" min="3" max="20" /></div>
          <div><label>CON</label><input type="number" id="score-con" value="10" min="3" max="20" /></div>
          <div><label>INT</label><input type="number" id="score-int" value="10" min="3" max="20" /></div>
          <div><label>WIS</label><input type="number" id="score-wis" value="10" min="3" max="20" /></div>
          <div><label>CHA</label><input type="number" id="score-cha" value="10" min="3" max="20" /></div>
        </div>
      </section>

      <!-- Navigation Controls -->
      <div class="nav-buttons">
        <button id="btn-prev" disabled>Previous</button>
        <button id="btn-next">Next</button>
      </div>

      <div class="action-buttons">
        <button id="btn-save">Save Character</button>
        <button id="btn-pdf">Export PDF</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
